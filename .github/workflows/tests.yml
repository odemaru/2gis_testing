name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Еженедельный прогон: strict xfail превратит исправление любого
    # из найденных дефектов в падение и тем самым сообщит об этом.
    - cron: "0 6 * * 1"

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установить зависимости
        run: pip install -r requirements.txt

      - name: Прогнать тесты
        run: pytest -v
